name: Bug report
description: nosnitch crashed, gave a wrong result or printed something confusing.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a database entry is wrong or out of date, use the "Add or correct an app" form instead.
        Found a security problem? Please do not open an issue. See [SECURITY.md](https://github.com/Umerrrdo/nosnitch/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: npx nosnitch scan docker-compose.yml --fix
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Run the command again with --debug and paste everything it prints.
      render: text
    validations:
      required: true
  - type: textarea
    id: compose
    attributes:
      label: Compose file
      description: The smallest part of your compose file that shows the problem. Remove passwords, tokens and private hostnames first.
      render: yaml
  - type: input
    id: version
    attributes:
      label: nosnitch version
      description: Output of `nosnitch --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and operating system
      placeholder: Node 22.11, Windows 11 (or the Docker image)
    validations:
      required: true
