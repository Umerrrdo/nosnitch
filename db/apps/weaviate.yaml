name: Weaviate
slug: weaviate
images:
  - semitechnologies/weaviate
  - cr.weaviate.io/semitechnologies/weaviate
telemetry_default: "on"
destinations:
  - telemetry.weaviate.io
what_is_sent: Server version, OS and architecture, module names, object and collection counts, cluster details and client library usage. No data objects, collection names or property names.
disable:
  - type: env
    name: DISABLE_TELEMETRY
    value: "true"
    note: Set it on every node.
sources:
  - https://docs.weaviate.io/deploy/configuration/telemetry
verified_on: "2026-11-11"
verified: true
